<mat-toolbar color="primary" class="app-navbar">
  <!-- Logo y Empresa Info -->
  <div class="navbar-left">
    <img [src]="logoDisplay" class="logo" alt="Logo empresa" matTooltip="Logo de {{ nombreEmpresa }}">

    <div class="empresa-section">
      <div class="empresa-nombre">{{ nombreEmpresa }}</div>
      <div class="empresa-cedula">{{ cedulaEmpresa }}</div>
    </div>

    <!-- Separador visual -->
    <mat-divider [vertical]="true" class="navbar-divider"></mat-divider>

    <!-- Usuario Info -->
    <div class="usuario-section" *ngIf="usuarioActivo">
      <mat-icon class="user-icon">person_circle</mat-icon>
      <div class="usuario-info">
        <div class="usuario-nombre">{{ usuarioActivo.nombre }}</div>
        <div class="usuario-rol">
          <mat-chip-set aria-label="Rol">
            <mat-chip [highlighted]="usuarioActivo.rol === 'admin'">
              {{ usuarioActivo.rol | uppercase }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Navigation Links -->
  <div class="navbar-center">
    <button mat-button routerLink="/rrhh" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>people</mat-icon>
      <span>RRHH</span>
    </button>

    <button mat-button routerLink="/planilla" routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>receipt</mat-icon>
      <span>PLANILLA</span>
    </button>

    <button mat-button routerLink="/finanzas" routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>trending_up</mat-icon>
      <span>FINANZAS</span>
    </button>

    <button mat-button routerLink="/vacaciones" routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>beach_access</mat-icon>
      <span>VACACIONES</span>
    </button>

    <button mat-button routerLink="/incapacidades" routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>local_hospital</mat-icon>
      <span>INCAPACIDADES/PERMISOS</span>
    </button>

    <button mat-button routerLink="/pagos" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>payment</mat-icon>
      <span>PAGOS</span>
    </button>

    <button mat-button routerLink="/reporteria" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>history</mat-icon>
      <span>Reportería</span>
    </button>

    <button mat-button routerLink="/configuracion" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
      <mat-icon>settings</mat-icon>
      <span>Configuración</span>
    </button>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Logout Button -->
  <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión" class="logout-btn">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
