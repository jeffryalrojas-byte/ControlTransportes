<div class="usuarios-container">
  <mat-card class="usuarios-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>people</mat-icon>
        Gestión de Usuarios
      </mat-card-title>
      <mat-card-subtitle>Administra los usuarios de tu empresa</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Botón agregar usuario -->
      <button mat-raised-button color="primary" (click)="abrirDialogoNuevoUsuario()" class="add-button">
        <mat-icon>person_add</mat-icon>
        Nuevo Usuario
      </button>

      <!-- Tabla de usuarios -->
      <div class="table-container">
        <table mat-table [dataSource]="usuarios" class="usuarios-table">
          <!-- Nombre Column -->
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let element">
              <strong>{{ element.nombre }}</strong>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let element">{{ element.email }}</td>
          </ng-container>

          <!-- Rol Column -->
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let element">
              <mat-chip-set>
                <mat-chip 
                  [color]="element.rol === 'admin' ? 'accent' : 'primary'"
                  selected
                  class="rol-chip"
                >
                  {{ element.rol | uppercase }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <!-- Estado Column -->
          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let element">
              <mat-icon class="estado-icon" [class.activo]="element.estado === 'activo'">
                {{ element.estado === 'activo' ? 'check_circle' : 'cancel' }}
              </mat-icon>
              {{ element.estado | titlecase }}
            </td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button matTooltip="Editar" (click)="editarUsuario(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button 
                mat-icon-button 
                matTooltip="Desactivar"
                *ngIf="element.estado === 'activo' && element.uid !== usuarioActual?.uid"
                (click)="desactivarUsuario(element)"
              >
                <mat-icon>block</mat-icon>
              </button>
              <button 
                mat-icon-button 
                matTooltip="Activar"
                *ngIf="element.estado === 'inactivo' && element.uid !== usuarioActual?.uid"
                (click)="activarUsuario(element)"
              >
                <mat-icon>check_circle</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <!-- Sin usuarios -->
      <div *ngIf="usuarios.length === 0" class="empty-state">
        <mat-icon>groups</mat-icon>
        <p>No hay usuarios registrados</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
